<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img" aria-label="Frame triangle: What is True, What Matters, What is Possible">
  

  
  <polygon points="180,40 320,220 40,220" fill="none" stroke="#303030" stroke-width="2"></polygon>

  
  <line x1="40" y1="220" x2="6" y2="220" stroke="#303030" stroke-width="1" stroke-dasharray="3 3"></line>
  <line x1="320" y1="220" x2="354" y2="220" stroke="#303030" stroke-width="1" stroke-dasharray="3 3"></line>
  <line x1="180" y1="245" x2="180" y2="232" stroke="#303030" stroke-width="1" stroke-dasharray="3 3"></line>

  
  <text x="6" y="208" class="axis-label">What is True</text>
