# Render service definition.
#
# This tool lives inside the my-website repository, so `rootDir` tells Render
# to build from this folder and ignore the Astro site around it. Cloudflare
# Pages does the opposite: it builds the Astro site and ignores this folder.
# One repository, two deployments, neither aware of the other.
#
# The two secrets are marked sync:false, which means Render will not read them
# from this file — you paste them into the dashboard once and they are never in
# the repository. See DEPLOY.md.

services:
  - type: web
    name: rupture-tools
    rootDir: tools/sameness-index
    # Docker, not python: the crawler needs Chromium, and Chromium needs system
    # libraries a managed runtime will not install. See Dockerfile.
    # The Dockerfile sits in rootDir, which is where Render looks by default.
    runtime: docker
    # Standard, not Starter: Starter is 512MB and Chromium needs about a
    # gigabyte to render a page reliably. The free plan is not an option either
    # — it sleeps, which would kill a run in flight.
    #
    # One browser is shared across runs rather than one per run, so 2GB holds.
    # If runs start failing on memory, the next step is Pro (4GB) rather than
    # more concurrency.
    plan: standard
    region: frankfurt      # nearest to the eu-west-2 database
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # Cost control. Raise deliberately, not casually — each run crawls live
      # sites and makes about a dozen model calls.
      - key: SAMENESS_RUNS_PER_IP
        value: "5"
      - key: SAMENESS_MAX_CONCURRENT
        value: "2"
      # Browser pages open at once, across every run on the box. Two runs of
      # two pages is four Chromium tabs, which 2GB holds; six does not.
      - key: SAMENESS_BROWSER_PAGES
        value: "2"
      # Where the evidence photographs live. The service key never leaves the
      # server; the bucket is public, because the report is meant to be
      # forwarded. Without these two the tool runs exactly as before and links
      # to every quote instead of showing it. See DEPLOY.md.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SAMENESS_SHOT_BUCKET
        value: sameness-evidence
      # Photographs per brand. Each one is a page load; four is the evidence for
      # the four most widely shared territories, which is where a reader doubts
      # the number.
      - key: SAMENESS_SHOTS_PER_BRAND
        value: "4"
